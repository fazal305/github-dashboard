<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Dashboard</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load of a
      // client-routed URL (e.g. /github-dashboard/users) 404s here instead
      // of reaching index.html. This re-encodes the path into a query
      // string and redirects to index.html, which decodes it back via the
      // matching script there. See https://github.com/rafgraph/spa-github-pages
      var segmentsToKeep = 1; // matches the /github-dashboard/ path segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
